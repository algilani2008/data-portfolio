[project]
name = "costguide"
version = "1.0.0"
description = "Saudi utility tariffs, wages and their impact: history, analysis and 2027-2028 forecasts"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24", "scipy>=1.10", "statsmodels>=0.14", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
