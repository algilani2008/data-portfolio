<script>
(function () {
"use strict";
const D = window.WW_DATA, S = D.summary, A = D.assumptions;
let LANG = "ar", VIEW = "overview";
try { LANG = localStorage.getItem("ww-lang") || "ar"; } catch (e) {}
const AR = () => LANG === "ar";
const L = (ar, en) => (AR() ? ar : en);
const $ = (id) => document.getElementById(id);
const fmt = (v, d = 0) => (v == null || isNaN(v) ? "–" : Number(v).toLocaleString(AR() ? "ar-SA-u-nu-latn" : "en-US", { minimumFractionDigits: d, maximumFractionDigits: d }));
const sgn = (v, d = 0) => (v > 0 ? "+" : v < 0 ? "−" : "") + fmt(Math.abs(v), d);
const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const name = (o) => (AR() ? o.name_ar : o.name_en);

// ---------- tariff engine (mirrors src/costguide/tariffs.py) ----------
const TF = D.tariffs, SEASON = D.seasonality, VAT = 0.15;
function prog(q, rows, lo, hi, rate) { let s = 0; for (const r of rows) { const a = r[lo], b = r[hi] == null ? Infinity : r[hi]; if (q > a) s += (Math.min(q, b) - a) * r[rate]; } return s; }
function band(rows, amps) { for (const r of rows) { const hi = r.breaker_to_a == null ? Infinity : r.breaker_to_a; if (amps >= r.breaker_from_a && amps < hi) return r.fee_sar; } return rows[rows.length - 1].fee_sar; }
function elecBill(kwh, amps, sched) {
  const rows = TF.electricity.filter((r) => r.schedule === sched).map((r) => ({ ...r, sar: r.rate_halala / 100 }));
  const fee = band(TF.electricity_fees.filter((r) => r.schedule === (sched === "2027" ? "2027" : "2018")), amps);
  return (prog(kwh, rows, "tier_from_kwh", "tier_to_kwh", "sar") + fee) * (1 + VAT);
}
function waterBill(m3, sched, sewage) {
  const rows = TF.water.filter((r) => r.schedule === sched);
  let c = prog(m3, rows, "tier_from_m3", "tier_to_m3", "water_sar"); if (sewage) c += prog(m3, rows, "tier_from_m3", "tier_to_m3", "sewage_sar");
  let fee = 0; if (sched === "2027") { const f = TF.water_fees[0]; fee = f.water_fee_sar + (sewage ? f.sewage_fee_sar : 0); }
  return (c + fee) * (1 + VAT);
}
function sectorBill(kwh, amps, sector, sched) {
  const rows = D.sector_tariffs.filter((r) => r.sector === sector && r.schedule === sched).map((r) => ({ ...r, sar: r.rate_halala / 100 }));
  const grp = sector === "agricultural" || sector === "charities" ? "agri_charity" : "nonresidential";
  const fee = band(D.sector_fees.filter((r) => r.fee_group === grp && r.schedule === sched), amps);
  return { energy: prog(kwh, rows, "tier_from_kwh", "tier_to_kwh", "sar"), fixed: fee };
}
const yearElec = (kwh, amps, sched, frac = 0) => SEASON.reduce((s, f) => s + elecBill(kwh * f * (1 - frac), amps, sched), 0);

// ---------- charts ----------
if (window.Chart) Chart.defaults.font.family = '"IBM Plex Sans Arabic", system-ui, sans-serif';
const charts = {};
function mk(id, cfg) { if (!window.Chart) return; try { if (charts[id]) charts[id].destroy(); const el = $(id); if (!el) return; charts[id] = new Chart(el, cfg); } catch (e) { console.error("chart " + id, e); } }

  const ink2 = css("--ink-2"), line = css("--line"), rtl = AR();
  return { responsive: true, maintainAspectRatio: false, animation: false, layout: { padding: { left: 14, right: 14 } }, interaction: { mode: "index", intersect: false }, indexAxis: o.h ? "y" : "x",
    plugins: { legend: { display: !!o.legend, labels: { color: ink2, boxWidth: 14, boxHeight: 3 } },

    scales: {
      x: { reverse: rtl && !o.h ? true : (o.h ? rtl : false), ticks: { color: ink2, maxRotation: 0, autoSkipPadding: 10, ...(o.xt || {}) }, grid: { color: line, display: !!o.h }, border: { color: line }, title: o.xtitle ? { display: true, text: o.xtitle, color: css("--ink-3") } : undefined, stacked: !!o.stack, min: o.xmin, max: o.xmax },
      y: { position: rtl ? "right" : "left", ticks: { color: ink2, ...(o.yt || {}) }, grid: { color: line, display: !o.h }, border: { display: false }, title: o.ytitle ? { display: true, text: o.ytitle, color: css("--ink-3") } : undefined, stacked: !!o.stack, display: o.ydisplay !== false },

function bNeed() {

    ["saudization", "هل يؤثر رفع حد الأجور على نطاقي في نطاقات؟", "Will the higher wage threshold change my Nitaqat band?", "نعم. السعودي الذي راتبه أقل من حد الاحتساب الكامل (5,000 ثم 6,000 ريال) قد يُحتسب نصف موظف، فتنخفض نسبتك المحتسبة وقد تنزل نطاقاً بدون أي تغيير في موظفيك. حاسبة التوطين توضح نطاقك لكل سنة وكم تحتاج.", "Yes. A Saudi paid below the full-count wage (5,000 then 6,000 SAR) may count as half, lowering your counted rate and possibly your band with no change in staff. The Saudization calculator shows your band each year and what you need."],

// ---------- ISIC CLASSES (all activities) ----------
const ISIC = D.isic, SECS = D.sections, NQ = D.nitaqat;
const isicName = (r) => (AR() ? r.ar : r.en);
const nqName = (id) => { const r = NQ.find((x) => x.id === id); return r ? (AR() ? r.name_ar : r.name_en) : ""; };
const profByCode = (code) => { const r = ISIC.find((x) => x.c === code); return r ? r.n : 41; };
function actById(id) { return ACT.find((x) => x.id === id) || ACT[0]; }
function nqForProfile(a) { const digits = (a.isic || "").replace(/\D/g, "").slice(0, 4); return profByCode(digits); }
function norm(s) { return (s || "").toLowerCase().replace(/[أإآ]/g, "ا").replace(/ة/g, "ه").replace(/ى/g, "ي"); }
function matches(q, ...fields) { if (!q) return true; const n = norm(q); return fields.some((f) => norm(String(f)).includes(n)); }
// options: detailed profiles + every ISIC class, filtered by group and search
function activityOptions(selectEl, group, q, cur) {
  const prof = ACT.filter((a) => (!group || a.group === group) && matches(q, a.name_ar, a.name_en, a.isic));
  const cls = ISIC.filter((r) => (!group || actById(r.p).group === group) && matches(q, r.ar, r.en, r.c));
  let html = prof.length ? `<optgroup label="${L("أنشطة بقيم تفصيلية", "Activities with detailed values")}">` + prof.map((a) => `<option value="p:${a.id}">${name(a)} · ${a.isic}</option>`).join("") + "</optgroup>" : "";
  const bySec = {};
  cls.forEach((r) => { (bySec[r.s] = bySec[r.s] || []).push(r); });
  Object.keys(bySec).sort().forEach((s) => { html += `<optgroup label="${s} · ${AR() ? SECS[s][0] : SECS[s][1]}">` + bySec[s].map((r) => `<option value="i:${r.c}">${r.c} · ${isicName(r)}</option>`).join("") + "</optgroup>"; });
  selectEl.innerHTML = html || `<option value="">${L("لا توجد نتيجة", "No match")}</option>`;
  if (cur && [...selectEl.options].some((o) => o.value === cur)) selectEl.value = cur;
}
function resolveActivity(val) {
  if (!val) return null;
  const [k, id] = val.split(":");
  if (k === "p") { const a = actById(id); return { a, label: name(a), code: a.isic, nq: nqForProfile(a) }; }
  const r = ISIC.find((x) => x.c === id); if (!r) return null;
  return { a: actById(r.p), label: `${r.c} · ${isicName(r)}`, code: r.c, nq: r.n };
}

// ---------- SAUDIZATION ----------
const BANDK = ["lg", "mg", "hg", "pl"];
const BANDN = () => ({ red: L("أحمر", "Red"), lg: L("أخضر منخفض", "Low green"), mg: L("أخضر متوسط", "Medium green"), hg: L("أخضر مرتفع", "High green"), pl: L("بلاتيني", "Platinum") });
const fullWage = (y) => (y <= 2026 ? 4000 : y === 2027 ? 5000 : 6000);
function nqRequired(id, n, y) {
  const a = NQ.find((x) => x.id === id) || NQ[NQ.length - 1], yy = String(Math.min(Math.max(y, 2026), 2028)).slice(2), out = {};
  let prev = 0;
  BANDK.forEach((b) => { let r = a["m_" + b] * Math.log(Math.max(1, n)) + a[`c${yy}_${b}`]; r = Math.min(100, Math.max(0, r, prev)); out[b] = r; prev = r; });
  return out;
}
function saStaff() { const v = (id) => Math.max(0, +$(id).value || 0); return { b6: v("sa-b6"), b5: v("sa-b5"), b4: v("sa-b4"), b3: v("sa-b3"), b0: v("sa-b0"), pt: v("sa-pt"), st: v("sa-st"), fx: v("sa-fx"), ds: v("sa-ds"), ns: v("sa-ns") }; }
function saAssess(id, s, y) {
  const t = fullWage(y), w = (lo) => (lo >= t ? 1 : lo >= 3000 ? 0.5 : 0);
  let num = s.b6 * w(6000) + s.b5 * w(5000) + s.b4 * w(4000) + s.b3 * w(3000) + 0.5 * s.pt + 0.5 * s.st + s.fx / 3 + 4 * s.ds;
  const den = s.b6 + s.b5 + s.b4 + s.b3 + s.b0 + s.pt + s.st + s.fx + s.ds * 4 + s.ns, heads = s.b6 + s.b5 + s.b4 + s.b3 + s.b0 + s.pt + s.st + s.fx + s.ds + s.ns;
  const rate = den ? (100 * num) / den : 0;
  if (heads <= 5) return { t, num, den, rate, heads, small: true, band: num >= 1 ? "pl" : "red", req: null, hires: { lg: num >= 1 ? 0 : 1, mg: num >= 1 ? 0 : 1, hg: num >= 1 ? 0 : 1, pl: num >= 1 ? 0 : 1 } };
  const req = nqRequired(id, Math.round(den), y);
  let band = "red"; BANDK.forEach((b) => { if (rate >= req[b] - 1e-9) band = b; });
  const hires = {}; BANDK.forEach((b) => { const tg = req[b] / 100; hires[b] = tg >= 1 ? Infinity : Math.max(0, Math.ceil((tg * den - num) / (1 - tg) - 1e-9)); });
  return { t, num, den, rate, heads, small: false, band, req, hires };
}
function saOptions() {
  activityOptions($("sa-act"), null, $("sa-q").value, $("sa-act").value || "p:restaurant");
  const cur = +$("sa-n").value || 0;
  $("sa-n").innerHTML = NQ.map((r) => `<option value="${r.id}">${r.id}. ${AR() ? r.name_ar : r.name_en}</option>`).join("");

}
function saPickActivity() { const r = resolveActivity($("sa-act").value); if (r) $("sa-n").value = r.nq; saudization(); }
function saImport() {
  const v = (id) => +$(id).value || 0, w1 = v("b-w1"), w2 = v("b-w2"), w3 = v("b-w3");
  ["sa-b6", "sa-b5", "sa-b4", "sa-b3", "sa-b0"].forEach((id) => ($(id).value = 0));
  const put = (n, w) => { const id = w >= 6000 ? "sa-b6" : w >= 5000 ? "sa-b5" : w >= 4000 ? "sa-b4" : w >= 3000 ? "sa-b3" : "sa-b0"; $(id).value = (+$(id).value || 0) + n; };
  put(v("b-n1"), w1); put(v("b-n2"), w2); put(v("b-n3"), w3); $("sa-ns").value = v("b-n4");
  if (BSTATE) { const cur = $("b-act").value; if ([...$("sa-act").options].some((o) => o.value === cur)) $("sa-act").value = cur; const r = resolveActivity(cur); if (r) $("sa-n").value = r.nq; }
  saudization();
}
function saudization() {
  const id = +$("sa-n").value || 41, s = saStaff(), yrs = [2026, 2027, 2028], R = yrs.map((y) => saAssess(id, s, y)), BN = BANDN(), c = C();
  const bandPill = (b) => `<span class="pill ${b === "red" ? "bad" : b === "lg" ? "warn" : "good"}">${BN[b]}</span>`;

    </tbody>`;
  const r26 = R[0], r28 = R[2], order = ["red", ...BANDK], drop = order.indexOf(r28.band) < order.indexOf(r26.band);

    (drop ? `<span class="pill bad">! ${L(`تنزل من ${BN[r26.band]} إلى ${BN[r28.band]} بحلول 2028 بسبب رفع حد الاحتساب، بدون أي تغيير في موظفيك`, `You drop from ${BN[r26.band]} to ${BN[r28.band]} by 2028 because of the higher full-count wage, with no change in your staff`)}</span>` :
      `<span class="pill good">✓ ${L(`تبقى في نطاق ${BN[r28.band]} أو أعلى حتى 2028`, `You stay in ${BN[r28.band]} or better through 2028`)}</span>`) +

  // options to keep the 2026 band in 2028
  const tgt = r26.band === "red" ? "lg" : r26.band, g = 1 + A.gosi_employer_rate_saudi_pct.value / 100;
  const hires = r28.small ? r28.hires[tgt] : r28.hires[tgt];
  const hireCost = hires === Infinity ? null : hires * 6000 * 12 * g;
  const raiseCost = (s.b5 * Math.max(0, 6000 - 5500) + s.b4 * (6000 - 4500) + s.b3 * (6000 - 3500)) * 12 * g;

  // chart: rate vs required by year

function trust() {
  const need = Math.max(0, +$("tr-need").value || 0), eff = +$("tr-eff").value / 100, anc = +$("tr-anc").value / 100, steps = +$("tr-plan").value;
  $("tr-eff-l").textContent = L(`ما تمتصه بالكفاءة وخفض التكاليف: ${fmt(eff * 100)}% من الزيادة`, `Absorbed through efficiency and cost cuts: ${fmt(eff * 100)}% of the rise`);
  $("tr-anc-l").textContent = L(`مبيعات منتجات تبقى أسعارها ثابتة: ${fmt(anc * 100)}%`, `Sales of items whose price stays fixed: ${fmt(anc * 100)}%`);
  const avg = need * (1 - eff), other = anc < 1 ? avg / (1 - anc) : avg;
  const dates = steps === 1 ? [[L("يناير 2027", "Jan 2027"), 1]] : steps === 2 ? [[L("يناير 2027", "Jan 2027"), 0.55], [L("مايو 2027", "May 2027"), 0.45]] : [[L("يناير 2027", "Jan 2027"), 0.4], [L("مايو 2027", "May 2027"), 0.3], [L("مايو 2028", "May 2028"), 0.3]];
  $("tr-out").innerHTML = `<div><span class="small">${L("متوسط زيادة سعر ما يدفعه العميل", "Average rise on what customers pay")}</span><b>${fmt(avg, 2)}%</b><span class="small">${L("بدل", "instead of")} ${fmt(need, 2)}%</span></div><div><span class="small">${L("على المنتجات غير الثابتة", "On items not held fixed")}</span><b>${fmt(other, 2)}%</b><span class="small">${L("منتجاتك الأساسية بدون تغيير", "essentials unchanged")}</span></div><div><span class="small">${L("أكبر دفعة واحدة", "Largest single step")}</span><b>${fmt(other * Math.max(...dates.map((d) => d[1])), 2)}%</b><span class="small">${L(steps === 1 ? "دفعة واحدة" : steps === 2 ? "دفعتان" : "3 دفعات", steps === 1 ? "one step" : steps + " steps")}</span></div>`;
  let cum = 0;
  $("t-tr").innerHTML = `<thead><tr><th>${L("الموعد", "When")}</th><th class="n">${L("الزيادة", "Rise")}</th><th class="n">${L("التراكمي", "Cumulative")}</th><th>${L("المرتبط به", "Tied to")}</th></tr></thead><tbody>` +
    dates.map(([d, sh], i) => { cum += other * sh; const why = i === 0 ? L("تعرفة الكهرباء والمياه", "Power & water tariffs") : i === 1 ? L("حد نطاقات 5,000", "Nitaqat 5,000") : L("حد نطاقات 6,000", "Nitaqat 6,000"); return `<tr><td>${d}</td><td class="n">+${fmt(other * sh, 2)}%</td><td class="n">${fmt(cum, 2)}%</td><td class="small">${why}</td></tr>`; }).join("") + "</tbody>";
  const c = C();
  mk("c-tr", { type: "bar", data: { labels: [L("الزيادة اللازمة", "Needed"), L("بعد الكفاءة", "After efficiency"), L("متوسط العميل", "Customer average"), L("المنتجات غير الثابتة", "Non-fixed items")], datasets: [{ label: "%", data: [need, need * (1 - eff), avg, other], backgroundColor: [c.ink2, c.aux, c.old, c.nw], borderRadius: 3, barPercentage: 0.55 }] },
    options: base({ yt: { callback: (v) => v + "%" }, tip: { label: (x) => fmt(x.raw, 2) + "%" } }) });
  message(avg, dates.length);
}
function message(avg, nSteps) {
  const nm = ($("ms-name").value || "").trim(), n = nm || L("", "us"), r = [], cm = [];

  if ($("ms-r2").checked) r.push(L("رفع رواتب زملائنا السعوديين وفق برنامج نطاقات", "higher pay for our Saudi colleagues under the Nitaqat programme"));
  if ($("ms-r3").checked) r.push(L("ارتفاع أسعار بعض الموردين", "higher prices from some suppliers"));
  if ($("ms-c1").checked) cm.push(L("أسعار منتجاتنا الأساسية تبقى كما هي", "our essential items keep their current price"));
  if ($("ms-c2").checked) cm.push(L("لن نغيّر الجودة ولا الكميات", "we will not change quality or portion sizes"));
  if ($("ms-c3").checked) cm.push(L("عملاؤنا الدائمون يحصلون على خصم خاص", "regular customers get a special discount"));
  const join = (a) => (a.length <= 1 ? a.join("") : a.slice(0, -1).join(AR() ? "، و" : ", ") + (AR() ? "، و" : " and ") + a[a.length - 1]);
  $("ms-out").textContent = AR()
    ? `عملاءنا الكرام،\n\n${nm ? `نشكر ثقتكم بـ${nm}.` : "نشكر ثقتكم بنا."} نود إبلاغكم مسبقاً بتعديل بعض أسعارنا بمتوسط ${fmt(avg, 1)}%${nSteps > 1 ? ` على ${nSteps === 2 ? "مرحلتين" : "3 مراحل"} خلال 2027${nSteps > 2 ? " و2028" : ""}` : " ابتداءً من يناير 2027"}.\n\n${r.length ? `سبب التعديل: ${join(r)}. ` : ""}امتصصنا جزءاً من هذه التكاليف بتحسين كفاءتنا، ونمرر الجزء المتبقي فقط.\n\n${cm.length ? `التزامنا لكم: ${join(cm)}.\n\n` : ""}نسعد باستفساراتكم في أي وقت.\n${nm || "إدارة المنشأة"}`
    : `Dear customers,\n\nThank you for trusting ${n}. We are letting you know in advance that some of our prices will change by an average of ${fmt(avg, 1)}%${nSteps > 1 ? ` in ${nSteps} steps during 2027${nSteps > 2 ? " and 2028" : ""}` : " from January 2027"}.\n\n${r.length ? `The reason: ${join(r)}. ` : ""}We have absorbed part of these costs by working more efficiently and are passing on only the rest.\n\n${cm.length ? `Our commitment: ${join(cm)}.\n\n` : ""}We are happy to answer any question.\n${nm || "The management"}`;
}
