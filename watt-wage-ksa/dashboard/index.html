<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>واط وأجر | Watt &amp; Wage</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Reem+Kufi:wght@500;700&display=swap">
<style>
/* Layout: one reading column of numbered-free sections; a calculator "meter" card leads, analysis follows in chart panels */
:root {
  --bg: #f5f7f6; --panel: #ffffff; --ink: #11201c; --ink-2: #4a5753; --ink-3: #75817d;
  --line: #dde3e0; --accent: #0f6b5c; --accent-soft: #e2f0ec;
  --old: #2a78d6; --new: #eb6834; --aux: #1baf7a; --aux2: #eda100; --band: rgba(42,120,214,.14); --band2: rgba(235,104,52,.18);
  --good: #12805c; --warn: #b45309;
  --display: "Reem Kufi", "IBM Plex Sans Arabic", system-ui, sans-serif;
  --body: "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1614; --panel: #16201d; --ink: #e9efec; --ink-2: #b4c0bb; --ink-3: #8a9792;
  --line: #2a3632; --accent: #5cc4ad; --accent-soft: #1c302b;
  --old: #3987e5; --new: #d95926; --aux: #199e70; --aux2: #c98500; --band: rgba(57,135,229,.20); --band2: rgba(217,89,38,.24);
  --good: #4cc79a; --warn: #f0a050; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1614; --panel: #16201d; --ink: #e9efec; --ink-2: #b4c0bb; --ink-3: #8a9792;
  --line: #2a3632; --accent: #5cc4ad; --accent-soft: #1c302b;
  --old: #3987e5; --new: #d95926; --aux: #199e70; --aux2: #c98500; --band: rgba(57,135,229,.20); --band2: rgba(217,89,38,.24);
  --good: #4cc79a; --warn: #f0a050; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.65; margin: 0 }
.wrap { max-width: 1120px; margin: 0 auto; padding-block: 28px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; line-height: 1.25 }
h1 { font-size: clamp(30px, 5vw, 46px); font-weight: 700 }
h2 { font-size: 24px; font-weight: 700 }
h3 { font-size: 16px; font-weight: 600; font-family: var(--body) }
p { margin: 0; max-width: 68ch }
.muted { color: var(--ink-2) }
.small { font-size: 13px; color: var(--ink-3) }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums }
header.top { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; justify-content: space-between; padding-bottom: 20px; border-bottom: 1px solid var(--line) }
.kicker { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); font-weight: 600 }
.lede { margin-top: 8px; color: var(--ink-2); font-size: 16px }
.toggle { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--panel) }
.toggle button { border: 0; background: transparent; color: var(--ink-2); padding: 6px 14px; font: inherit; font-size: 13px; cursor: pointer }
.toggle button[aria-pressed="true"] { background: var(--accent); color: var(--panel) }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }

.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 22px }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 4px; align-content: start }
.kpi .v { font-family: var(--mono); font-size: 26px; font-weight: 500; font-variant-numeric: tabular-nums }
.kpi .l { font-size: 13px; color: var(--ink-2) }
.kpi .s { font-size: 12px; color: var(--ink-3) }
@media (max-width: 820px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)) } }

section { margin-top: 44px; display: grid; gap: 14px }
section > .intro { display: grid; gap: 6px }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px }
@media (max-width: 820px) { .grid2 { grid-template-columns: minmax(0, 1fr) } }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; display: grid; gap: 10px; align-content: start }
.chart { position: relative; height: 300px; min-width: 0 }
.chart.tall { height: 360px }
.chart.short { height: 240px }

/* calculator: the "meter" */
.meter { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 0; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden }
.meter .inputs { padding: 18px; display: grid; gap: 14px; border-inline-end: 1px solid var(--line); background: var(--accent-soft) }
.meter .outputs { padding: 18px; display: grid; gap: 12px; min-width: 0 }
@media (max-width: 820px) { .meter { grid-template-columns: minmax(0, 1fr) } .meter .inputs { border-inline-end: 0; border-bottom: 1px solid var(--line) } }
.field { display: grid; gap: 6px }
.field label { font-size: 13px; font-weight: 600; color: var(--ink-2) }
.field .row { display: flex; gap: 10px; align-items: center }
.field input[type=range] { flex: 1; accent-color: var(--accent); min-width: 0 }
.field input[type=number], .field select { font: inherit; font-family: var(--mono); background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; width: 110px }
.field select { width: 100%; font-family: var(--body) }
.check { display: flex; gap: 8px; align-items: center; font-size: 14px }
.check input { accent-color: var(--accent); width: 18px; height: 18px }
.readout { display: grid; grid-template-columns: auto 1fr 1fr; gap: 6px 14px; align-items: baseline }
.readout .h { font-size: 12px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .06em }
.readout .k { color: var(--ink-2); font-size: 14px }
.readout .o, .readout .n { font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: end }
.readout .o { color: var(--ink-2) }
.readout .total { border-top: 1px solid var(--line); padding-top: 6px; font-weight: 600; color: var(--ink) }
.verdict { border-radius: 8px; padding: 12px 14px; display: grid; gap: 4px; border: 1px solid var(--line) }
.verdict .big { font-family: var(--mono); font-size: 22px; font-variant-numeric: tabular-nums }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 2px 10px; border-radius: 999px; border: 1px solid currentColor; width: fit-content }
.pill.good { color: var(--good) } .pill.warn { color: var(--warn) }

.tablewrap { overflow-x: auto }
table { border-collapse: collapse; width: 100%; font-size: 14px }
th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: start; white-space: nowrap }
th { font-size: 12px; color: var(--ink-3); font-weight: 600; letter-spacing: .04em }
td.num, th.num { text-align: end }
.up { color: var(--warn) } .down { color: var(--good) }

.timeline { list-style: none; margin: 0; padding: 0; display: grid; gap: 0 }
.timeline li { display: grid; grid-template-columns: 92px 14px minmax(0, 1fr); gap: 10px; padding-block: 8px; align-items: start }
.timeline .d { font-family: var(--mono); font-size: 13px; color: var(--ink-3); text-align: end }
.timeline .dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 7px; background: var(--ink-3) }
.timeline .t { font-weight: 600 } .timeline .x { font-size: 13px; color: var(--ink-2) }
.timeline li.future .t::after { content: attr(data-future); font-size: 11px; color: var(--new); margin-inline-start: 8px; border: 1px solid currentColor; padding: 0 6px; border-radius: 999px }
.cat-electricity .dot { background: var(--old) } .cat-water .dot { background: var(--aux) } .cat-tax .dot { background: var(--aux2) }
.cat-wages .dot { background: var(--new) } .cat-support .dot { background: var(--accent) }

.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--ink-2) }
.legend span { display: inline-flex; align-items: center; gap: 6px }
.legend i { width: 14px; height: 3px; border-radius: 2px; display: inline-block }
.callout { border-inline-start: 3px solid var(--accent); padding: 4px 12px; color: var(--ink-2); font-size: 14px }
.slider-out { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px }
.slider-out div { display: grid; gap: 2px } .slider-out b { font-family: var(--mono); font-size: 20px; font-weight: 500 }
@media (max-width: 520px) { .slider-out { grid-template-columns: minmax(0, 1fr) } .readout { grid-template-columns: minmax(0, 1.2fr) 1fr 1fr } }
details { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 16px }
details summary { cursor: pointer; font-weight: 600 }
details ul { margin: 10px 0 0; padding-inline-start: 20px; display: grid; gap: 4px; font-size: 14px; color: var(--ink-2) }
a { color: var(--accent) }
footer { margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 13px; color: var(--ink-3); display: grid; gap: 6px }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important } }
</style>

</head>
<body>
<div class="wrap" id="app">
  <header class="top">
    <div style="display:grid;gap:6px;min-width:0">
      <div class="kicker" data-i="kicker"></div>
      <h1 data-i="title"></h1>
      <p class="lede" data-i="lede"></p>
    </div>
    <div class="toggle" role="group" aria-label="Language">
      <button id="lang-ar" type="button" aria-pressed="true">عربي</button>
      <button id="lang-en" type="button" aria-pressed="false">English</button>
    </div>
  </header>

  <div class="kpis" id="kpis"></div>

  <!-- calculator -->
  <section>
    <div class="intro"><h2 data-i="calcH"></h2><p class="muted" data-i="calcP"></p></div>
    <div class="meter">
      <div class="inputs">
        <div class="field"><label for="kwh" data-i="kwhL"></label>
          <div class="row"><input type="range" id="kwh-r" min="100" max="10000" step="50" value="1550" aria-label="kWh"><input type="number" id="kwh" min="0" max="30000" step="10" value="1550"></div></div>
        <div class="field"><label for="breaker" data-i="brL"></label>
          <select id="breaker"><option value="60">20 – 99 A</option><option value="150" selected>100 – 199 A</option><option value="250">200 – 299 A</option><option value="350">300 A +</option></select></div>
        <div class="field"><label for="m3" data-i="m3L"></label>
          <div class="row"><input type="range" id="m3-r" min="0" max="150" step="1" value="43" aria-label="m3"><input type="number" id="m3" min="0" max="500" step="1" value="43"></div></div>
        <label class="check"><input type="checkbox" id="sewage" checked><span data-i="sewL"></span></label>
        <label class="check"><input type="checkbox" id="support"><span data-i="supL"></span></label>
        <label class="check"><input type="checkbox" id="annual" checked><span data-i="annL"></span></label>
        <p class="small" data-i="calcNote"></p>
      </div>
      <div class="outputs">
        <div class="readout" id="readout"></div>
        <div class="verdict" id="verdict"></div>
      </div>
    </div>
  </section>

  <!-- households -->
  <section>
    <div class="intro"><h2 data-i="hhH"></h2><p class="muted" data-i="hhP"></p></div>
    <div class="grid2">
      <div class="panel"><h3 data-i="hhC1"></h3><div class="chart"><canvas id="c-profiles"></canvas></div></div>
      <div class="panel"><h3 data-i="hhC2"></h3><div class="chart"><canvas id="c-deciles"></canvas></div><p class="small" data-i="hhC2n"></p></div>
    </div>
    <div class="panel"><div class="tablewrap"><table id="t-profiles"></table></div></div>
  </section>

  <!-- tariffs -->
  <section>
    <div class="intro"><h2 data-i="tarH"></h2><p class="muted" data-i="tarP"></p></div>
    <div class="grid2">
      <div class="panel"><h3 data-i="tarC1"></h3><div class="chart"><canvas id="c-elec"></canvas></div></div>
      <div class="panel"><h3 data-i="tarC2"></h3><div class="chart"><canvas id="c-water"></canvas></div></div>
    </div>
    <div class="grid2">
      <div class="panel"><h3 data-i="secH"></h3><div class="tablewrap"><table id="t-sectors"></table></div><p class="small" data-i="secN"></p></div>
      <div class="panel"><h3 data-i="tlH"></h3><ul class="timeline" id="timeline"></ul></div>
    </div>
  </section>

  <!-- inflation -->
  <section>
    <div class="intro"><h2 data-i="infH"></h2><p class="muted" data-i="infP"></p></div>
    <div class="panel"><h3 data-i="infC1"></h3><div class="legend" id="lg-cpi"></div><div class="chart tall"><canvas id="c-cpi"></canvas></div></div>
    <div class="grid2">
      <div class="panel"><h3 data-i="evH"></h3><div class="chart"><canvas id="c-events"></canvas></div><div class="tablewrap"><table id="t-events"></table></div></div>
      <div class="panel"><h3 data-i="mcH"></h3><div class="chart short"><canvas id="c-mc"></canvas></div><p class="small" id="mc-note"></p>
        <h3 data-i="torH"></h3><div class="chart short"><canvas id="c-tornado"></canvas></div></div>
    </div>
  </section>

  <!-- wages -->
  <section>
    <div class="intro"><h2 data-i="wgH"></h2><p class="muted" data-i="wgP"></p></div>
    <div class="grid2">
      <div class="panel"><h3 data-i="wgC1"></h3><div class="chart"><canvas id="c-wages"></canvas></div><p class="small" data-i="wgC1n"></p></div>
      <div class="panel"><h3 data-i="wgSl"></h3>
        <div class="field"><label for="thr" id="thr-l"></label><input type="range" id="thr" min="4000" max="8000" step="250" value="5000"></div>
        <div class="slider-out" id="thr-out"></div>
        <div class="callout" id="precedent"></div>
        <div class="tablewrap"><table id="t-wages"></table></div>
      </div>
    </div>
  </section>

  <!-- fiscal -->
  <section>
    <div class="intro"><h2 data-i="fiH"></h2><p class="muted" data-i="fiP"></p></div>
    <div class="panel"><div class="chart short"><canvas id="c-fiscal"></canvas></div><p class="small" data-i="fiN"></p></div>
  </section>

  <section>
    <details><summary data-i="methH"></summary><ul id="method"></ul></details>
    <details><summary data-i="srcH"></summary><ul id="sources"></ul></details>
  </section>

  <footer><span data-i="foot"></span><span class="num" id="gen"></span></footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="data.js"></script>

// ---------- tariff engine (mirrors src/wattwage/tariffs.py) ----------
const TF = D.tariffs;
const SEASON = D.seasonality;
function prog(q, rows, lo, hi, rate) {
  let s = 0;
  for (const r of rows) { const a = r[lo], b = r[hi] == null ? Infinity : r[hi]; if (q > a) s += (Math.min(q, b) - a) * r[rate]; }
  return s;
}
function elecFee(amps, sched) {
  const fs = TF.electricity_fees.filter((r) => r.schedule === (sched === "2027" ? "2027" : "2018"));
  for (const r of fs) { const hi = r.breaker_to_a == null ? Infinity : r.breaker_to_a; if (amps >= r.breaker_from_a && amps < hi) return r.fee_sar; }
  return fs[fs.length - 1].fee_sar;
}
function elecBill(kwh, amps, sched, vat) {
  const rows = TF.electricity.filter((r) => r.schedule === sched).map((r) => ({ ...r, sar: r.rate_halala / 100 }));
  const e = prog(kwh, rows, "tier_from_kwh", "tier_to_kwh", "sar");
  return (e + elecFee(amps, sched)) * (1 + vat);
}
function waterBill(m3, sched, sewage, vat) {
  const rows = TF.water.filter((r) => r.schedule === sched);
  let c = prog(m3, rows, "tier_from_m3", "tier_to_m3", "water_sar");
  if (sewage) c += prog(m3, rows, "tier_from_m3", "tier_to_m3", "sewage_sar");
  let fee = 0;
  if (sched === "2027") { const f = TF.water_fees[0]; fee = f.water_fee_sar + (sewage ? f.sewage_fee_sar : 0); }
  return (c + fee) * (1 + vat);
}

// ---------- calculator ----------
const $ = (id) => document.getElementById(id);
function link(a, b) { $(a).addEventListener("input", () => { $(b).value = $(a).value; calc(); }); $(b).addEventListener("input", () => { $(a).value = $(b).value; calc(); }); }
function calc() {
  const kwh = Math.max(0, +$("kwh").value || 0), amps = +$("breaker").value, m3 = Math.max(0, +$("m3").value || 0);
  const sew = $("sewage").checked, sup = $("support").checked, annual = $("annual").checked;
  let eo = 0, en = 0;
  if (annual) { for (const f of SEASON) { eo += elecBill(kwh * f, amps, "2018", 0.15); en += elecBill(kwh * f, amps, "2027", 0.15); } }
  else { eo = elecBill(kwh, amps, "2018", 0.15); en = elecBill(kwh, amps, "2027", 0.15); }
  const k = annual ? 12 : 1;
  const wo = waterBill(m3, "2016", sew, 0.15) * k, wn = waterBill(m3, "2027", sew, 0.15) * k;
  const to = eo + wo, tn = en + wn, inc = tn - to, allowance = 500 * k;
  const pct = (a, b) => (a > 0 ? ` <span class="small">(${b >= a ? "+" : ""}${fmt(100 * (b / a - 1), 0)}%)</span>` : "");
  $("readout").innerHTML = `
    <div class="h">${t("item")}</div><div class="h" style="text-align:end">${t("now")}</div><div class="h" style="text-align:end">${t("next")}</div>
    <div class="k">${t("elec")}</div><div class="o">${fmt(eo)}</div><div class="n">${fmt(en)}${pct(eo, en)}</div>
    <div class="k">${t("water")}</div><div class="o">${fmt(wo)}</div><div class="n">${fmt(wn)}${pct(wo, wn)}</div>
    <div class="k total">${t("total")} (${t("sar")} ${annual ? t("perYear") : t("perMonth")})</div><div class="o total">${fmt(to)}</div><div class="n total">${fmt(tn)}${pct(to, tn)}</div>`;
  let v = `<div class="small">${t("incr")} ${annual ? t("perYear") : t("perMonth")}</div><div class="big">+${fmt(inc)} ${t("sar")}</div>`;
  if (sup) {
    const net = allowance - inc, ok = net >= 0;
    v += `<div>${t("netAfter")}: <span class="num">${ok ? "+" : "−"}${fmt(Math.abs(net))} ${t("sar")}</span></div><span class="pill ${ok ? "good" : "warn"}">${ok ? "✓ " + t("covered") : "! " + t("notCovered")}</span>`;
  } else v += `<span class="pill warn">${t("noSupport")}</span>`;
  $("verdict").innerHTML = v;
}

  const EW = D.event_windows, evs = [...new Set(EW.map((r) => r.event))], hs = [...new Set(EW.map((r) => r.h))];
  const ecol = [css("--old"), css("--new"), css("--aux")];
  mk("c-events", { type: "line", data: { labels: hs, datasets: evs.map((e, i) => { const rows = EW.filter((r) => r.event === e); return { label: rtl ? rows[0].event_ar : e, data: rows.map((r) => r.cpi_yoy_pct), borderColor: ecol[i], backgroundColor: ecol[i], borderWidth: 2, pointRadius: 0 }; }) },
    options: { ...base(), plugins: { ...base().plugins, tooltip: { ...base().plugins.tooltip, callbacks: { title: (c) => `${t("months")}: ${c[0].label}`, label: (c) => `${c.dataset.label}: ${fmt(c.raw, 2)}%` } } },
      scales: { ...base().scales, x: { ...base().scales.x, reverse: rtl, title: { display: true, text: t("months"), color: css("--ink-3") } }, y: { ...base().scales.y, ticks: { color: css("--ink-2"), callback: (v) => v + "%" } } } } });
  // MC histogram
  const M = D.mc_hist, p = S.inflation.mc_p10_p50_p90_2027;
  mk("c-mc", { type: "bar", data: { labels: M.map((b) => fmt((b.x0 + b.x1) / 2, 1) + "%"), datasets: [{ label: "n", data: M.map((b) => b.n), backgroundColor: M.map((b) => ((b.x0 + b.x1) / 2 >= p[0] && (b.x0 + b.x1) / 2 <= p[2] ? css("--new") : css("--line"))), borderRadius: 2, categoryPercentage: 1, barPercentage: 0.92 }] },
    options: { ...base(), plugins: { ...base().plugins, legend: { display: false } }, scales: { ...base().scales, x: { ...base().scales.x, reverse: rtl, ticks: { ...base().scales.x.ticks, autoSkip: true, maxTicksLimit: 7 } }, y: { ...base().scales.y, display: false } } } });
  $("mc-note").textContent = rtl ? `الوسيط ${fmt(p[1], 1)}%، و80% من المحاكاة بين ${fmt(p[0], 1)}% و${fmt(p[2], 1)}% (الأعمدة الملوّنة).` : `Median ${fmt(p[1], 1)}%; 80% of runs fall between ${fmt(p[0], 1)}% and ${fmt(p[2], 1)}% (coloured bars).`;
  // tornado
  const TO = D.tornado, c0 = TO[0].center;
  mk("c-tornado", { type: "bar", data: { labels: TO.map((r) => (rtl ? r.input_ar : r.input_en)), datasets: [{ label: "pp", data: TO.map((r) => [r.low, r.high]), backgroundColor: css("--old"), borderRadius: 3, barPercentage: 0.6 }] },
    options: { ...base(), indexAxis: "y", plugins: { ...base().plugins, legend: { display: false }, tooltip: { ...base().plugins.tooltip, callbacks: { label: (c) => `${fmt(c.raw[0], 2)} – ${fmt(c.raw[1], 2)} pp` } } },
      scales: { x: { ...base().scales.x, reverse: rtl, min: Math.floor(Math.min(...TO.map((r) => r.low)) * 10) / 10 - 0.1, title: { display: true, text: (rtl ? "الصدمة المركزية " : "central shock ") + fmt(c0, 2) + " pp", color: css("--ink-3") } }, y: { ...base().scales.y, grid: { display: false }, ticks: { color: css("--ink-2"), font: { size: 11 } } } } } });
  // wages histogram
  const WH = D.wages.hist;
  const thrPlugin = { id: "thr", afterDatasetsDraw(ch) { const { ctx, chartArea: a, scales: { x } } = ch; ctx.save(); ctx.strokeStyle = css("--new"); ctx.lineWidth = 1.5; ctx.fillStyle = css("--ink"); ctx.font = "11px " + Chart.defaults.font.family;
    [[4000, rtl ? "4,000 الآن" : "4,000 now", 0], [5000, "5,000 (2027)", 14], [6000, "6,000 (2028)", 28]].forEach(([v, l, dy]) => { const i = WH.findIndex((b) => b.from === v); if (i < 0) return; const px = x.getPixelForValue(i) - (rtl ? -1 : 1) * x.width / WH.length / 2; ctx.beginPath(); ctx.moveTo(px, a.top); ctx.lineTo(px, a.bottom); ctx.stroke(); ctx.textAlign = rtl ? "right" : "left"; ctx.fillText(l, px + (rtl ? -4 : 4), a.top + 12 + dy); }); ctx.restore(); } };
  mk("c-wages", { type: "bar", plugins: [thrPlugin], data: { labels: WH.map((b) => b.from), datasets: [{ label: t("workers"), data: WH.map((b) => b.workers), backgroundColor: css("--old"), borderRadius: 2, categoryPercentage: 1, barPercentage: 0.9 }] },
    options: { ...base(), plugins: { ...base().plugins, legend: { display: false }, tooltip: { ...base().plugins.tooltip, callbacks: { title: (c) => `${fmt(WH[c[0].dataIndex].from)}–${fmt(WH[c[0].dataIndex].to)} ${t("sar")}`, label: (c) => `${fmt(c.raw)}` } } },
      scales: { ...base().scales, x: { ...base().scales.x, reverse: rtl, ticks: { ...base().scales.x.ticks, autoSkip: false, callback: (v, i) => (WH[i].from % 2000 === 0 ? fmt(WH[i].from) : "") } }, y: { ...base().scales.y, ticks: { color: css("--ink-2"), callback: (v) => fmt(v / 1000) + "k" } } } } });
  // fiscal
  const FI = D.fiscal, rev = S.fiscal.residential_revenue;
  const fl = [t("supportCost"), t("elecRev"), t("waterRev")], fv = [FI[1].cost_bn_sar_year, rev.elec_extra_bn_sar_year, rev.water_extra_bn_sar_year_upper];
  mk("c-fiscal", { type: "bar", data: { labels: fl, datasets: [{ label: t("bn"), data: fv, backgroundColor: [css("--accent"), css("--new"), css("--aux")], borderRadius: 4, barPercentage: 0.55 }] },
    options: { ...base(), indexAxis: "y", plugins: { ...base().plugins, legend: { display: false }, tooltip: { ...base().plugins.tooltip, callbacks: { label: (c) => `${fmt(c.raw, 1)} ${t("bn")}${c.dataIndex === 0 ? ` (${fmt(FI[0].cost_bn_sar_year, 0)}–${fmt(FI[2].cost_bn_sar_year, 0)})` : ""}` } } },
      scales: { x: { ...base().scales.x, reverse: rtl, title: { display: true, text: t("bn"), color: css("--ink-3") } }, y: { ...base().scales.y, grid: { display: false }, ticks: { color: css("--ink-2") } } } } });
}

// ---------- tables & lists ----------
function tables() {
  const rtl = LANG === "ar";
  $("t-profiles").innerHTML = `<thead><tr><th>${t("profile")}</th><th class="num">${t("kwhm")}</th><th class="num">${t("m3m")}</th><th class="num">${t("oldY")}</th><th class="num">${t("newY")}</th><th class="num">${t("incY")}</th><th class="num">${t("pct")}</th><th class="num">${t("cover")}</th></tr></thead><tbody>` +
    D.profiles.map((p) => `<tr><td>${rtl ? p.name_ar : p.name_en}</td><td class="num">${fmt(p.kwh_month)}</td><td class="num">${fmt(p.water_m3)}</td><td class="num">${fmt(p.total_old_year)}</td><td class="num">${fmt(p.total_new_year)}</td><td class="num up">+${fmt(p.increase_year)}</td><td class="num up">+${fmt(p.increase_pct, 1)}%</td><td class="num">${fmt(p.support_covers_pct)}%</td></tr>`).join("") + "</tbody>";
  $("t-sectors").innerHTML = `<thead><tr><th>${t("sector")}</th><th class="num">${t("t1")} 2018</th><th class="num">2027</th><th class="num">${t("t2")} 2018</th><th class="num">2027</th><th class="num">${t("ch")}</th></tr></thead><tbody>` +
    TF.sectors.map((s) => `<tr><td>${rtl ? s.sector_ar : s.sector}</td><td class="num">${s.tier1_2018}</td><td class="num">${s.tier1_2027}</td><td class="num">${s.tier2_2018}</td><td class="num">${s.tier2_2027}</td><td class="num up">+${fmt(s.tier1_change_pct, 1)}%</td></tr>`).join("") + "</tbody>";
  $("t-events").innerHTML = `<thead><tr><th>${t("ev")}</th><th class="num">${t("jump")}</th><th class="num">${t("rev")}</th></tr></thead><tbody>` +
    D.events.map((e) => `<tr><td>${rtl ? e.name_ar : e.name_en}</td><td class="num up">+${fmt(e.jump_pp, 2)}</td><td class="num down">${fmt(e.reversal_pp_12m_later, 2)}</td></tr>`).join("") + "</tbody>";
  const today = "2026-10-25";
  $("timeline").innerHTML = D.policy_events.map((e) => `<li class="cat-${e.category} ${e.date > today ? "future" : ""}"><span class="d">${e.date.slice(0, 7)}</span><span class="dot"></span><span><span class="t" data-future="${t("future")}">${rtl ? e.title_ar : e.title_en}</span>${rtl ? "" : `<br><span class="x">${e.detail_en}</span>`}</span></li>`).join("");
  $("t-wages").innerHTML = `<thead><tr><th class="num">${t("thr")}</th><th class="num">${t("comp")}</th><th class="num">${t("workers")}</th><th class="num">${t("cost")}</th></tr></thead><tbody>` +
    D.wages.table.filter((r) => r.bunching > 0).map((r) => `<tr><td class="num">${fmt(r.threshold)}</td><td class="num">${fmt(r.compliance * 100)}%</td><td class="num">${fmt(r.workers_raised)}</td><td class="num">${fmt(r.employer_cost_bn_sar_year, 1)} ${t("bn")}</td></tr>`).join("") + "</tbody>";
  const h = S.wages.history;
  $("precedent").textContent = t("precedent")(fmt(h.below_4000_2020), fmt(h.below_4000_q2_2026), fmt(h.reduction_pct, 0));
  $("method").innerHTML = t("method").map((m) => `<li>${m}</li>`).join("");
  const src = [
    ["الشركة السعودية للطاقة: تعرفة 2027 (سبق)", "https://sabq.org/article/mzza5x9"],
    ["Water & electricity 2027 tariffs, support (news50)", "https://news50.sa/reports/saudi-500-riyal-support-electricity-water-2027/"],
    ["Sector tariffs 2027 (Aleqaria)", "https://www.aleqaria.com.eg/post/details/355756"],
    ["2016 & 2018 residential tariffs (Saudi Gazette)", "https://saudigazette.com.sa/article/525167"],
    ["SEC tariff schedule incl. meter fees (ESMAP RISE)", "https://rise.esmap.org/sites/default/files/library/saudi-arabia/Renewable%20Energy/Saudi%20Arabia%20Tariff%20Schedule_2022.pdf"],
    ["2016 water tariff (Argaam)", "https://www.argaam.com/ar/article/articledetail/id/416258"],
    ["GASTAT Electrical Energy Statistics 2024", "https://www.stats.gov.sa/documents/20117/2435281/Electrical+Energy+Statistics+2024+EN.pdf/fe9d3d6f-809b-cdb9-7559-3f2a21f4e415"],
    ["KAPSARC: consumption after the 2018 reform", "https://www.kapsarc.org/newsroom/news/electricity-consumptions-dropped-after-energy-price-reforms-in-saudi-arabia"],
    ["Monthly CPI inflation (OECD via inflationtool)", "https://www.inflationtool.com/rates/saudi-arabia/historical"],
    ["NLO Labor Snapshot Q2 2026", "https://nlo.gov.sa/en/download/labor-snopshot-q2-2026/"],
    ["Nitaqat 4,000 SAR decision (HRSD)", "https://www.hrsd.gov.sa/media-center/news/777585"],
    ["660,497 Saudis below 4,000 in 2020 (Okaz)", "https://www.okaz.com.sa/economy/saudi/2048826"],
    ["2018 support package cost (Al-Jarida)", "https://www.aljarida.com/articles/1515260837862710300"],
    ["Royal support package, 25 Oct 2026 (Al Jazeera)", "https://www.aljazeera.net/ebusiness/2026/10/25/%D8%A7%D9%84%D8%B3%D8%B9%D9%88%D8%AF%D9%8A%D8%A9-%D8%AA%D8%B1%D9%81%D8%B9-%D8%A3%D8%B3%D8%B9%D8%A7%D8%B1-%D8%A7%D9%84%D9%83%D9%87%D8%B1%D8%A8%D8%A7%D8%A1-%D9%88%D8%A7%D9%84%D9%85%D9%8A%D8%A7%D9%87"],
  ];
  $("sources").innerHTML = src.map(([l, u]) => `<li><a href="${u}" target="_blank" rel="noopener">${l}</a></li>`).join("");
}

// ---------- threshold slider ----------
function slider() {
  const v = +$("thr").value, r = D.wages.curve.find((x) => x.threshold === v);
  $("thr-out").innerHTML = `<div><span class="small">${t("thr")}</span><b>${fmt(v)}</b></div><div><span class="small">${t("below")}</span><b>${fmt(r.workers_below)}</b><span class="small">${fmt(r.share_below_pct, 1)}%</span></div><div><span class="small">${t("cost")}</span><b>${fmt(r.employer_cost_bn_sar_year, 1)}</b><span class="small">${t("bn")} · ${t("raise")} ${fmt(r.avg_raise_sar)}</span></div>`;
}

function render() { applyText(); kpis(); calc(); tables(); slider(); drawCharts(); }
function setLang(l) { LANG = l; try { localStorage.setItem("ww-lang", l); } catch (e) {} render(); }
$("lang-ar").addEventListener("click", () => setLang("ar"));
$("lang-en").addEventListener("click", () => setLang("en"));
link("kwh-r", "kwh"); link("m3-r", "m3");
["breaker", "sewage", "support", "annual"].forEach((id) => $(id).addEventListener("input", calc));
$("thr").addEventListener("input", slider);
try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", drawCharts); } catch (e) {}
new MutationObserver(drawCharts).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
render();
})();
</script>
</body>
</html>
