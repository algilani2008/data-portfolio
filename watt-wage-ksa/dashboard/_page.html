main { padding-block: 22px 60px }

.readout { display: grid; grid-template-columns: minmax(0, 1.3fr) 1fr 1fr; gap: 6px 14px; align-items: baseline }

.big { font-family: var(--mono); font-size: 26px; font-variant-numeric: tabular-nums }

.tablewrap { overflow-x: auto }
table { border-collapse: collapse; width: 100%; font-size: 13.5px }
th, td { padding: 7px 9px; border-bottom: 1px solid var(--line); text-align: start; white-space: nowrap }
th { font-size: 11.5px; color: var(--ink-3); font-weight: 600 }

.timeline li { display: grid; grid-template-columns: 74px 12px minmax(0, 1fr); gap: 10px; padding-block: 6px }
.timeline .d { font-family: var(--mono); font-size: 12.5px; color: var(--ink-3); text-align: end }
.timeline .dot { width: 9px; height: 9px; border-radius: 50%; margin-top: 7px; background: var(--ink-3) }
.timeline .t { font-weight: 600; font-size: 14px } .timeline .x { font-size: 12.5px; color: var(--ink-2) }

.measure { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 8px 0; border-bottom: 1px solid var(--line) }
.measure:last-child { border-bottom: 0 }
.measure .m-s { font-family: var(--mono); font-size: 13px; text-align: end; color: var(--good); white-space: nowrap }
.measure .m-d { font-size: 12px; color: var(--ink-3) }
details { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 16px }
details summary { cursor: pointer; font-weight: 600 }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important } }

<script>
(function () {
"use strict";
const D = window.WW_DATA, S = D.summary, A = D.assumptions;
let LANG = "ar", VIEW = "overview";
try { LANG = localStorage.getItem("ww-lang") || "ar"; } catch (e) {}
const AR = () => LANG === "ar";
const L = (ar, en) => (AR() ? ar : en);
const $ = (id) => document.getElementById(id);
const fmt = (v, d = 0) => (v == null || isNaN(v) ? "–" : Number(v).toLocaleString(AR() ? "ar-SA-u-nu-latn" : "en-US", { minimumFractionDigits: d, maximumFractionDigits: d }));
const sgn = (v, d = 0) => (v > 0 ? "+" : v < 0 ? "−" : "") + fmt(Math.abs(v), d);
const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const name = (o) => (AR() ? o.name_ar : o.name_en);

// ---------- tariff engine (mirrors src/wattwage/tariffs.py) ----------
const TF = D.tariffs, SEASON = D.seasonality, VAT = 0.15;
function prog(q, rows, lo, hi, rate) { let s = 0; for (const r of rows) { const a = r[lo], b = r[hi] == null ? Infinity : r[hi]; if (q > a) s += (Math.min(q, b) - a) * r[rate]; } return s; }
function band(rows, amps) { for (const r of rows) { const hi = r.breaker_to_a == null ? Infinity : r.breaker_to_a; if (amps >= r.breaker_from_a && amps < hi) return r.fee_sar; } return rows[rows.length - 1].fee_sar; }
function elecBill(kwh, amps, sched) {
  const rows = TF.electricity.filter((r) => r.schedule === sched).map((r) => ({ ...r, sar: r.rate_halala / 100 }));
  const fee = band(TF.electricity_fees.filter((r) => r.schedule === (sched === "2027" ? "2027" : "2018")), amps);
  return (prog(kwh, rows, "tier_from_kwh", "tier_to_kwh", "sar") + fee) * (1 + VAT);
}
function waterBill(m3, sched, sewage) {
  const rows = TF.water.filter((r) => r.schedule === sched);
  let c = prog(m3, rows, "tier_from_m3", "tier_to_m3", "water_sar"); if (sewage) c += prog(m3, rows, "tier_from_m3", "tier_to_m3", "sewage_sar");
  let fee = 0; if (sched === "2027") { const f = TF.water_fees[0]; fee = f.water_fee_sar + (sewage ? f.sewage_fee_sar : 0); }
  return (c + fee) * (1 + VAT);
}
function sectorBill(kwh, amps, sector, sched) {
  const rows = D.sector_tariffs.filter((r) => r.sector === sector && r.schedule === sched).map((r) => ({ ...r, sar: r.rate_halala / 100 }));
  const grp = sector === "agricultural" || sector === "charities" ? "agri_charity" : "nonresidential";
  const fee = band(D.sector_fees.filter((r) => r.fee_group === grp && r.schedule === sched), amps);
  return { energy: prog(kwh, rows, "tier_from_kwh", "tier_to_kwh", "sar"), fixed: fee };
}
const yearElec = (kwh, amps, sched, frac = 0) => SEASON.reduce((s, f) => s + elecBill(kwh * f * (1 - frac), amps, sched), 0);

// ---------- charts ----------
Chart.defaults.font.family = '"IBM Plex Sans Arabic", system-ui, sans-serif';
const charts = {};
function mk(id, cfg) { if (charts[id]) charts[id].destroy(); const el = $(id); if (!el) return; charts[id] = new Chart(el, cfg); }
function base(o = {}) {
  const ink2 = css("--ink-2"), line = css("--line"), rtl = AR();
  return { responsive: true, maintainAspectRatio: false, animation: false, interaction: { mode: "index", intersect: false }, indexAxis: o.h ? "y" : "x",
    plugins: { legend: { display: !!o.legend, labels: { color: ink2, boxWidth: 14, boxHeight: 3 } },
      tooltip: { rtl, backgroundColor: css("--panel"), titleColor: css("--ink"), bodyColor: ink2, borderColor: line, borderWidth: 1, callbacks: o.tip || {} } },
    scales: {
      x: { reverse: rtl && !o.h ? true : (o.h ? rtl : false), ticks: { color: ink2, maxRotation: 0, autoSkipPadding: 10, ...(o.xt || {}) }, grid: { color: line, display: !!o.h }, border: { color: line }, title: o.xtitle ? { display: true, text: o.xtitle, color: css("--ink-3") } : undefined, stacked: !!o.stack, min: o.xmin },
      y: { position: rtl ? "right" : "left", ticks: { color: ink2, ...(o.yt || {}) }, grid: { color: line, display: !o.h }, border: { display: false }, title: o.ytitle ? { display: true, text: o.ytitle, color: css("--ink-3") } : undefined, stacked: !!o.stack, display: o.ydisplay !== false },
    } };
}
const C = () => ({ old: css("--old"), nw: css("--new"), aux: css("--aux"), aux2: css("--aux2"), aux3: css("--aux3"), acc: css("--accent"), good: css("--good"), bad: css("--bad"), ink2: css("--ink-2"), line: css("--line"), band: css("--band"), band2: css("--band2") });
const legend = (id, items) => { $(id).innerHTML = items.map(([c, l, thick]) => `<span><i style="background:${c};${thick ? "height:10px" : ""}"></i>${l}</span>`).join(""); };

// ---------- OVERVIEW ----------
function overview() {
  const e = S.electricity, inf = S.inflation, w = S.wages, so = S.society, b = S.business;
  const k = [
    ["up", "+" + fmt(e.avg_bill_change_pct, 1) + "%", L("متوسط فاتورة الكهرباء السكنية", "Average home electricity bill"), L(`من ${fmt(e.avg_bill_old_year)} إلى ${fmt(e.avg_bill_new_year)} ريال سنوياً`, `${fmt(e.avg_bill_old_year)} to ${fmt(e.avg_bill_new_year)} SAR a year`)],
    ["up", "+" + fmt(S.water.avg_bill_change_pct, 1) + "%", L("متوسط فاتورة المياه والصرف", "Average water & sewage bill"), L("الزيادة أعلى للاستهلاك الصغير", "Larger for small users")],
    ["up", fmt(inf.central_2027, 1) + "%", L("التضخم المتوقع 2027", "Forecast 2027 inflation"), L(`مقابل ${fmt(inf.baseline_2027, 1)}% بدون القرار`, `vs ${fmt(inf.baseline_2027, 1)}% without it`)],
    ["", fmt(b.passthrough_check.private_sector_extra_bn, 1), L("مليار ريال تكلفة إضافية على القطاع الخاص", "bn SAR extra cost to business"), L("كهرباء فقط، سنوياً", "electricity only, per year")],
    ["", fmt(w.workers_below_5000 / 1e6, 2) + L(" مليون", "m"), L("سعوديون تحت حد 5,000 ريال", "Saudis below the 5,000 SAR threshold"), L(`${fmt(w.share_below_5000_pct, 1)}% من سعوديي القطاع الخاص`, `${fmt(w.share_below_5000_pct, 1)}% of Saudi private staff`)],
    ["dn", fmt(so.response.co2_mt_saved_year, 1) + " Mt", L("انبعاثات CO₂ تُتجنب سنوياً", "CO₂ avoided per year"), L(`${fmt(so.response.gwh_saved_year)} جيجاواط ساعة أقل`, `${fmt(so.response.gwh_saved_year)} GWh less`)],
  ];
  $("ov-kpis").innerHTML = k.map(([c, v, l, s]) => `<div class="kpi ${c}"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${s}</div></div>`).join("");
  const bd = Object.fromEntries(D.burden.map((r) => [r.id, r]));
  const ins = [
    [L("الرسم الثابت هو القصة الأكبر", "The fixed charge is the big story"), L(`فاتورة أصغر 10% من المستهلكين ترتفع ${fmt(e.decile1_change_pct)}% مقابل ${fmt(e.decile10_change_pct)}% لأكبرهم.`, `The smallest 10% of users see +${fmt(e.decile1_change_pct)}% vs +${fmt(e.decile10_change_pct)}% for the largest.`)],
    [L("المقيمون خارج التعويض", "Expatriates get no compensation"), L(`أسرة مقيمة نموذجية تخسر ${fmt(-bd.expat_family.net_2028_year)} ريال سنوياً (${fmt(-bd.expat_family.net_pct_income, 1)}% من دخلها). ${fmt(so.coverage.covered_share_of_metered_pct)}% فقط من الأسر ذات العدادات يشملها البدل.`, `A typical expatriate family loses ${fmt(-bd.expat_family.net_2028_year)} SAR a year (${fmt(-bd.expat_family.net_pct_income, 1)}% of income). Only ${fmt(so.coverage.covered_share_of_metered_pct)}% of metered households get the allowance.`)],
    [L("موظف القطاع الخاص منخفض الأجر هو الرابح الأكبر", "Low-paid private staff gain most"), L(`إذا التزمت المنشأة، يرتفع راتب 4,200 إلى 6,000: مكسب ${fmt(bd.private_low.wage_uplift_2028_year)} ريال سنوياً مقابل ${fmt(bd.private_low.bill_increase_year)} زيادة فواتير.`, `If the employer complies, a 4,200 salary rises to 6,000: +${fmt(bd.private_low.wage_uplift_2028_year)} SAR a year against +${fmt(bd.private_low.bill_increase_year)} in bills.`)],
    [L("في التجارة: الأجور أثقل من الكهرباء", "In commerce, wages weigh more than power"), L("لمحل صغير، رفع حد نطاقات يكلّف 5 أضعاف زيادة الكهرباء. في الصناعة الثقيلة العكس: الكهرباء هي الأثقل.", "For a small shop the Nitaqat threshold costs five times the electricity rise. In heavy industry it is the reverse.")],
    [L("صدمة لمرة واحدة", "A one-off shock"), L(`التضخم يرتفع إلى ${fmt(inf.central_2027, 1)}% في 2027 ويعود إلى ${fmt(inf.central_2028, 1)}% في 2028، كما حدث بعد إصلاحات 2016 و2018 و2020.`, `Inflation rises to ${fmt(inf.central_2027, 1)}% in 2027 and returns to ${fmt(inf.central_2028, 1)}% in 2028, as after the 2016, 2018 and 2020 reforms.`)],
    [L("إجراءات شبه مجانية تعوّض أغلب الزيادة", "Near-free steps offset most of it"), L(`ضبط المكيف وLED والمرشّدات تعوّض نحو ${fmt(S.solutions.bundles.typical.offset_pct)}% من زيادة المنزل المتوسط بتكلفة ${fmt(S.solutions.bundles.typical.bundle_cost)} ريال.`, `Thermostat, LEDs and aerators offset about ${fmt(S.solutions.bundles.typical.offset_pct)}% of a typical home's increase for ${fmt(S.solutions.bundles.typical.bundle_cost)} SAR.`)],
  ];
  $("ov-ins").innerHTML = ins.map(([h, t]) => `<div class="ins"><b>${h}</b><span>${t}</span></div>`).join("");
  const O = D.outlook, c = C();
  mk("c-ov", { type: "line", data: { labels: O.map((r) => r.year), datasets: [
    { label: L("الاستهلاك السكني بدون القرار (تيراواط)", "Residential use, no reform (TWh)"), data: O.map((r) => r.residential_gwh_no_reform / 1000), borderColor: c.old, borderDash: [5, 4], borderWidth: 2, pointRadius: 3, backgroundColor: c.old },
    { label: L("مع القرار", "With reform"), data: O.map((r) => r.residential_gwh_with_reform / 1000), borderColor: c.nw, borderWidth: 2, pointRadius: 3, backgroundColor: c.nw }] },

// ---------- routing & language ----------
const VIEWS = ["overview", "household", "society", "commercial", "industrial", "labour", "forecast", "solutions", "method"];
const drawn = {};
function draw(v) {
  if (v === "overview") overview();
  if (v === "household") { household(); profilesCharts(); }
  if (v === "society") society();
  if (v === "commercial") { commercial(); bizCharts(); }
  if (v === "industrial") industrial();
  if (v === "labour") labour();
  if (v === "forecast") { forecastView(); forecastStatic(); }
  if (v === "solutions") { solutionsStatic(); solutionsView(); }
  if (v === "method") method();
  drawn[v] = LANG;
}
function show(v) {
  if (!VIEWS.includes(v)) v = "overview";
  VIEW = v;
  VIEWS.forEach((x) => { $("v-" + x).hidden = x !== v; });
  document.querySelectorAll("#tabs a").forEach((a) => a.setAttribute("aria-current", a.dataset.v === v ? "page" : "false"));
  const act = document.querySelector(`#tabs a[data-v="${v}"]`); if (act && act.scrollIntoView) try { act.scrollIntoView({ block: "nearest", inline: "nearest" }); } catch (e) {}
  draw(v);
}
function applyLang() {
  document.documentElement.lang = LANG; document.documentElement.dir = AR() ? "rtl" : "ltr";
  document.querySelectorAll("[data-ar]").forEach((el) => { el.textContent = AR() ? el.dataset.ar : el.dataset.en; });
  $("l-ar").setAttribute("aria-pressed", AR()); $("l-en").setAttribute("aria-pressed", !AR());
  $("gen").textContent = L(" · آخر بناء للبيانات: ", " · Data built: ") + S.generated;
  const cur = $("bz-a").value;
  $("bz-a").innerHTML = BZ.map((b) => `<option value="${b.id}">${name(b)}</option>`).join("") + `<option value="custom">${L("أرقامي الخاصة", "My own numbers")}</option>`;
  $("bz-a").value = cur || "restaurant";
}
function setLang(l) { LANG = l; try { localStorage.setItem("ww-lang", l); } catch (e) {} applyLang(); show(VIEW); }

D.business.forEach((b) => { WAGES[b.id] = b.saudi_wages || []; MARGIN[b.id] = b.net_margin_pct; });

$("l-ar").addEventListener("click", () => setLang("ar"));
$("l-en").addEventListener("click", () => setLang("en"));
document.querySelectorAll("#tabs a").forEach((a) => a.addEventListener("click", (e) => { e.preventDefault(); show(a.dataset.v); try { history.replaceState(null, "", "#" + a.dataset.v); } catch (er) {} window.scrollTo({ top: 0 }); }));
const link = (a, b, fn) => { $(a).addEventListener("input", () => { $(b).value = $(a).value; fn(); }); $(b).addEventListener("input", () => { $(a).value = $(b).value; fn(); }); };
link("kwh-r", "kwh", household); link("m3-r", "m3", household);
["breaker", "sewage", "who", "ac-n", "ac-s", "ac-w"].forEach((id) => $(id).addEventListener("input", household));
$("ac-use").addEventListener("click", () => { const v = acEstimate(); $("kwh").value = v; $("kwh-r").value = Math.min(10000, v); household(); });
$("bz-a").addEventListener("change", () => { if ($("bz-a").value !== "custom") bzLoad($("bz-a").value); commercial(); });
["bz-sec", "bz-kwh", "bz-br", "bz-rev", "bz-mg", "bz-n1", "bz-w1", "bz-n2", "bz-w2"].forEach((id) => $(id).addEventListener("input", () => { if (id !== "bz-sec") $("bz-a").value = "custom"; commercial(); }));
["thr", "comp"].forEach((id) => $(id).addEventListener("input", labour));
["s-we", "s-ww", "s-pt", "s-el"].forEach((id) => $(id).addEventListener("input", forecastView));
$("s-reset").addEventListener("click", () => { $("s-we").value = 1.9; $("s-ww").value = 0.4; $("s-pt").value = 35; $("s-el").value = -0.1; forecastView(); });
$("sv-p").addEventListener("change", solutionsView);
const redraw = () => draw(VIEW);
try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", redraw); } catch (e) {}
new MutationObserver(redraw).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

applyLang();
bzLoad("restaurant");
const h0 = (location.hash || "").replace("#", "");
show(VIEWS.includes(h0) ? h0 : "overview");
})();
</script>
