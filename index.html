<style>
/* Layout: an operator's console. Sticky tab rail; each tab = one audience (household, society, business, industry, labour, forecast, solutions); controls sit left/right of the read-out they drive. */
:root {
  --bg: #f4f6f5; --panel: #ffffff; --panel-2: #eef3f1; --ink: #10201c; --ink-2: #47554f; --ink-3: #737f7a;
  --line: #dbe2de; --accent: #0f6b5c; --accent-ink: #ffffff; --accent-soft: #e0efea;
  --old: #2a78d6; --new: #eb6834; --aux: #1baf7a; --aux2: #eda100; --aux3: #6250d6;
  --band: rgba(42,120,214,.14); --band2: rgba(235,104,52,.18);
  --good: #12805c; --bad: #c2410c; --warn: #b45309;
  --display: "Reem Kufi", "IBM Plex Sans Arabic", system-ui, sans-serif;
  --body: "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1513; --panel: #151f1c; --panel-2: #1a2723; --ink: #e8eeeb; --ink-2: #b3bfba; --ink-3: #87948f;
  --line: #2a3632; --accent: #5cc4ad; --accent-ink: #0e1513; --accent-soft: #1b302a;
  --old: #3987e5; --new: #d95926; --aux: #199e70; --aux2: #c98500; --aux3: #9085e9;
  --band: rgba(57,135,229,.20); --band2: rgba(217,89,38,.24);
  --good: #4cc79a; --bad: #f08a5d; --warn: #f0a050; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0e1513; --panel: #151f1c; --panel-2: #1a2723; --ink: #e8eeeb; --ink-2: #b3bfba; --ink-3: #87948f;
  --line: #2a3632; --accent: #5cc4ad; --accent-ink: #0e1513; --accent-soft: #1b302a;
  --old: #3987e5; --new: #d95926; --aux: #199e70; --aux2: #c98500; --aux3: #9085e9;
  --band: rgba(57,135,229,.20); --band2: rgba(217,89,38,.24);
  --good: #4cc79a; --bad: #f08a5d; --warn: #f0a050; color-scheme: dark }

* { box-sizing: border-box }
[hidden] { display: none !important }
@media (max-width: 600px) {
  table { font-size: 12px } th, td { padding: 6px 5px }
  table.pnl th:nth-child(3), table.pnl td:nth-child(3), table.pnl th:nth-child(5), table.pnl td:nth-child(5) { display: none }
  table.pnl td:first-child { white-space: normal; min-width: 110px }
  .tablewrap { margin-inline: -6px }
  .kpi .v { font-size: 20px }
  h2 { font-size: 19px }
}
html { -webkit-text-size-adjust: 100% }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.6; margin: 0 }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel) }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.inner { max-width: 1180px; margin: 0 auto }
h1, h2, h3 { margin: 0; line-height: 1.25; text-wrap: balance }
h1 { font-family: var(--display); font-size: clamp(26px, 4vw, 36px); font-weight: 700 }
h2 { font-family: var(--display); font-size: 22px; font-weight: 700 }
h3 { font-size: 15px; font-weight: 600 }
p { margin: 0; max-width: 70ch }
.muted { color: var(--ink-2) } .small { font-size: 12.5px; color: var(--ink-3) }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums }

header.top { background: var(--panel); border-bottom: 1px solid var(--line); padding-block: 18px 14px }
header.top .inner { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: flex-end; justify-content: space-between }
.brand { display: grid; gap: 4px; min-width: 0 }
.kicker { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); font-weight: 600 }
.lede { color: var(--ink-2); font-size: 14.5px }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--panel) }
.seg button { border: 0; background: transparent; color: var(--ink-2); padding: 6px 14px; font: inherit; font-size: 13px; cursor: pointer }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink) }

nav.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line) }
nav.tabs .inner { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none }
nav.tabs .inner::-webkit-scrollbar { display: none }
nav.tabs a { flex: 0 0 auto; padding: 11px 14px; color: var(--ink-2); text-decoration: none; font-size: 14px; font-weight: 500; border-bottom: 2px solid transparent; white-space: nowrap }
nav.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent) }
nav.tabs a:hover { color: var(--ink) }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }

main { padding-block: 22px 60px }
.view { display: grid; gap: 18px }
.vhead { display: grid; gap: 6px }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 2px; align-content: start }
.kpi .v { font-family: var(--mono); font-size: 24px; font-weight: 500; font-variant-numeric: tabular-nums }
.kpi .l { font-size: 12.5px; color: var(--ink-2) } .kpi .s { font-size: 11.5px; color: var(--ink-3) }
.kpi.up .v { color: var(--bad) } .kpi.dn .v { color: var(--good) }
.g2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px }
.g3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px }
.g-ctl { display: grid; grid-template-columns: minmax(0, 4fr) minmax(0, 7fr); gap: 14px }
@media (max-width: 900px) { .g2, .g3, .g-ctl { grid-template-columns: minmax(0, 1fr) } }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; display: grid; gap: 10px; align-content: start }
.panel.ctl { background: var(--accent-soft); border-color: transparent }
.chart { position: relative; height: 290px; min-width: 0 } .chart.t { height: 360px } .chart.s { height: 220px }
.field { display: grid; gap: 5px }
.field > label, .field > .lab { font-size: 12.5px; font-weight: 600; color: var(--ink-2) }
.row { display: flex; gap: 10px; align-items: center }
input[type=range] { flex: 1; accent-color: var(--accent); min-width: 0 }
input[type=number], select { font: inherit; font-size: 14px; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px }
input[type=number] { font-family: var(--mono); width: 104px }
select { width: 100% }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; cursor: pointer }
.check input { accent-color: var(--accent); width: 17px; height: 17px; margin-top: 3px; flex: 0 0 auto }
.btn { font: inherit; font-size: 13px; border: 1px solid var(--accent); color: var(--accent); background: transparent; border-radius: 999px; padding: 5px 12px; cursor: pointer; width: fit-content }
.btn:hover { background: var(--accent); color: var(--accent-ink) }
.readout { display: grid; grid-template-columns: minmax(0, 1.3fr) 1fr 1fr; gap: 6px 14px; align-items: baseline }
.readout .h { font-size: 11.5px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .06em }
.readout .k { color: var(--ink-2); font-size: 14px }
.readout .o, .readout .n { font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: end }
.readout .o { color: var(--ink-2) } .readout .tot { border-top: 1px solid var(--line); padding-top: 6px; font-weight: 600; color: var(--ink) }
.big { font-family: var(--mono); font-size: 26px; font-variant-numeric: tabular-nums }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 2px 10px; border-radius: 999px; border: 1px solid currentColor; width: fit-content }
.pill.good { color: var(--good) } .pill.bad { color: var(--bad) } .pill.warn { color: var(--warn) }
.stat3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px }
.stat3 > div { display: grid; gap: 1px } .stat3 b { font-family: var(--mono); font-size: 19px; font-weight: 500; font-variant-numeric: tabular-nums }
@media (max-width: 520px) { .stat3 { grid-template-columns: minmax(0, 1fr) } }
.tablewrap { overflow-x: auto }
table { border-collapse: collapse; width: 100%; font-size: 13.5px }
th, td { padding: 7px 9px; border-bottom: 1px solid var(--line); text-align: start; white-space: nowrap }
th { font-size: 11.5px; color: var(--ink-3); font-weight: 600 }
td.n, th.n { text-align: end; font-family: var(--mono); font-variant-numeric: tabular-nums }
.up { color: var(--bad) } .dn { color: var(--good) }
tr.sel td { background: var(--panel-2) }
.insights { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px }
.ins { border-inline-start: 3px solid var(--accent); background: var(--panel); padding: 10px 14px; border-radius: 0 var(--r) var(--r) 0; display: grid; gap: 3px }
[dir="rtl"] .ins { border-radius: var(--r) 0 0 var(--r) }
.ins b { font-size: 14.5px } .ins span { font-size: 13.5px; color: var(--ink-2) }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--ink-2) }
.legend span { display: inline-flex; align-items: center; gap: 6px }
.legend i { width: 14px; height: 3px; border-radius: 2px; display: inline-block }
.timeline { list-style: none; margin: 0; padding: 0; display: grid }
.timeline li { display: grid; grid-template-columns: 74px 12px minmax(0, 1fr); gap: 10px; padding-block: 6px }
.timeline .d { font-family: var(--mono); font-size: 12.5px; color: var(--ink-3); text-align: end }
.timeline .dot { width: 9px; height: 9px; border-radius: 50%; margin-top: 7px; background: var(--ink-3) }
.timeline .t { font-weight: 600; font-size: 14px } .timeline .x { font-size: 12.5px; color: var(--ink-2) }
.c-electricity .dot { background: var(--old) } .c-water .dot { background: var(--aux) } .c-tax .dot { background: var(--aux2) } .c-wages .dot { background: var(--new) } .c-support .dot { background: var(--accent) }
.fut .t::after { content: attr(data-f); font-size: 11px; color: var(--new); margin-inline-start: 8px; border: 1px solid currentColor; padding: 0 6px; border-radius: 999px }
.measure { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 8px 0; border-bottom: 1px solid var(--line) }
.measure:last-child { border-bottom: 0 }
.measure .m-s { font-family: var(--mono); font-size: 13px; text-align: end; color: var(--good); white-space: nowrap }
.measure .m-d { font-size: 12px; color: var(--ink-3) }
details { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 16px }
details summary { cursor: pointer; font-weight: 600 }
details ul { margin: 10px 0 0; padding-inline-start: 20px; display: grid; gap: 5px; font-size: 13.5px; color: var(--ink-2) }
a { color: var(--accent) }
footer { padding-block: 16px 30px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--ink-3) }
.hero { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 16px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 18px }
.hero-txt { display: grid; gap: 6px }
.roles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px }
@media (max-width: 1100px) { .roles { grid-template-columns: repeat(2, minmax(0, 1fr)) } }
.role { display: grid; gap: 2px; padding: 12px 14px; border-radius: var(--r); background: var(--accent-soft); color: var(--ink); text-decoration: none; border: 1px solid transparent }
.role:hover { border-color: var(--accent) }
.role b { font-size: 15px } .role span { font-size: 12.5px; color: var(--ink-2) }
@media (max-width: 900px) { .hero { grid-template-columns: minmax(0, 1fr) } }
@media (max-width: 460px) { .roles { grid-template-columns: minmax(0, 1fr) } }
.mini { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 12px; font-size: 13.5px }
.mini b { font-weight: 600 } .mini .mo { font-family: var(--mono); font-variant-numeric: tabular-nums }
.mini input { width: 110px } .mini select { width: auto; max-width: 220px }
.row2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px }
.row2 input[type=number] { width: 100% }
.fs { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px 10px; margin: 0; display: grid; gap: 8px; background: var(--panel) }
.fs legend { font-size: 12.5px; font-weight: 600; color: var(--ink-2); padding: 0 4px }
.staff { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 0.8fr) minmax(0, 1fr); gap: 6px 8px; align-items: center }
.staff input { width: 100% }
.kpis-s { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)) }
.kpis-s .kpi .v { font-size: 20px }
table.pnl td:first-child { color: var(--ink-2) }
table.pnl tr.sum td { font-weight: 600; border-top: 1px solid var(--ink-3) }
table.clickable tbody tr { cursor: pointer }
table.clickable tbody tr:hover td { background: var(--panel-2) }
.chart.xl { height: 900px }
.story { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px }
.story .st { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 4px; align-content: start }
.story .st .big { font-size: 28px }
.story .st p { font-size: 13.5px; color: var(--ink-2) }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px }
.steps li { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 10px; font-size: 13.5px }
.steps .d { font-family: var(--mono); color: var(--new); font-size: 12.5px }
.cats { display: grid; gap: 6px }
.cat { display: grid; grid-template-columns: minmax(0, 1fr) 96px 52px; gap: 8px; align-items: center; font-size: 13px }
.cat input { width: 100% } .cat .r { font-family: var(--mono); font-size: 12px; color: var(--ink-3); text-align: end }
.search, textarea { font: inherit; font-size: 14px; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100% }
textarea { resize: vertical; min-height: 44px; flex: 1 }
.btn.solid { background: var(--accent); color: var(--accent-ink) }
.answer { white-space: pre-wrap; font-size: 14.5px; line-height: 1.7; color: var(--ink) }
.answer:empty { display: none }
.faq { display: grid; gap: 8px }
.faq details { padding: 10px 14px }
.faq details p { margin-top: 8px; font-size: 14px; color: var(--ink-2) }
.faq .go { font-size: 12.5px; margin-top: 6px; display: inline-block }
.chips { display: flex; flex-wrap: wrap; gap: 6px; max-height: 340px; overflow-y: auto }
.chip { font: inherit; font-size: 12.5px; text-align: start; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 999px; padding: 4px 10px; cursor: pointer }
.chip:hover { border-color: var(--accent); background: var(--accent-soft) }
.chip .num { color: var(--ink-3); font-size: 11.5px }
ul.tips { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px }
ul.tips li { display: grid; gap: 2px; border-inline-start: 3px solid var(--accent); padding-inline-start: 10px }
ul.tips b { font-size: 14px } ul.tips span { font-size: 13.5px; color: var(--ink-2) }
pre.msg { white-space: pre-wrap; font: inherit; font-size: 14.5px; line-height: 1.8; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 14px; margin: 0 }
#sa-act { min-height: 0 }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important } }
</style>

</head>

<script>

// ---------- tariff engine (mirrors src/wattwage/tariffs.py) ----------
const TF = D.tariffs, SEASON = D.seasonality, VAT = 0.15;
function prog(q, rows, lo, hi, rate) { let s = 0; for (const r of rows) { const a = r[lo], b = r[hi] == null ? Infinity : r[hi]; if (q > a) s += (Math.min(q, b) - a) * r[rate]; } return s; }
function band(rows, amps) { for (const r of rows) { const hi = r.breaker_to_a == null ? Infinity : r.breaker_to_a; if (amps >= r.breaker_from_a && amps < hi) return r.fee_sar; } return rows[rows.length - 1].fee_sar; }
function elecBill(kwh, amps, sched) {
  const rows = TF.electricity.filter((r) => r.schedule === sched).map((r) => ({ ...r, sar: r.rate_halala / 100 }));
  const fee = band(TF.electricity_fees.filter((r) => r.schedule === (sched === "2027" ? "2027" : "2018")), amps);
  return (prog(kwh, rows, "tier_from_kwh", "tier_to_kwh", "sar") + fee) * (1 + VAT);
}
function waterBill(m3, sched, sewage) {
  const rows = TF.water.filter((r) => r.schedule === sched);
  let c = prog(m3, rows, "tier_from_m3", "tier_to_m3", "water_sar"); if (sewage) c += prog(m3, rows, "tier_from_m3", "tier_to_m3", "sewage_sar");
  let fee = 0; if (sched === "2027") { const f = TF.water_fees[0]; fee = f.water_fee_sar + (sewage ? f.sewage_fee_sar : 0); }
  return (c + fee) * (1 + VAT);
}
function sectorBill(kwh, amps, sector, sched) {
  const rows = D.sector_tariffs.filter((r) => r.sector === sector && r.schedule === sched).map((r) => ({ ...r, sar: r.rate_halala / 100 }));
  const grp = sector === "agricultural" || sector === "charities" ? "agri_charity" : "nonresidential";
  const fee = band(D.sector_fees.filter((r) => r.fee_group === grp && r.schedule === sched), amps);
  return { energy: prog(kwh, rows, "tier_from_kwh", "tier_to_kwh", "sar"), fixed: fee };
}
const yearElec = (kwh, amps, sched, frac = 0) => SEASON.reduce((s, f) => s + elecBill(kwh * f * (1 - frac), amps, sched), 0);

    ["trust", "كيف أرفع أسعاري بدون أن أخسر عملائي؟", "How do I raise prices without losing customers?", "ارفع بقدر التكلفة الحقيقية فقط، وأعلن قبل التطبيق مع السبب، وثبّت أسعار المنتجات الأساسية، وتدرّج على دفعتين مرتبطتين بموعدي التعرفة ونطاقات، ولا تخفض الجودة أو الكمية سراً. صفحة مجاراة التضخم تعطيك خطة ورسالة جاهزة.", "Raise only by your real cost, announce ahead with the reason, keep essentials fixed, go in two steps tied to the tariff and Nitaqat dates, and never cut quality or size quietly. The pricing page gives you a plan and a ready message."],

const ISIC = D.isic, SECS = D.sections, NQ = D.nitaqat;
const isicName = (r) => (AR() ? r.ar : r.en);
const nqName = (id) => { const r = NQ.find((x) => x.id === id); return r ? (AR() ? r.name_ar : r.name_en) : ""; };
const profByCode = (code) => { const r = ISIC.find((x) => x.c === code); return r ? r.n : 41; };
function actById(id) { return ACT.find((x) => x.id === id) || ACT[0]; }
function nqForProfile(a) { const digits = (a.isic || "").replace(/\D/g, "").slice(0, 4); return profByCode(digits); }
function norm(s) { return (s || "").toLowerCase().replace(/[أإآ]/g, "ا").replace(/ة/g, "ه").replace(/ى/g, "ي"); }
function matches(q, ...fields) { if (!q) return true; const n = norm(q); return fields.some((f) => norm(String(f)).includes(n)); }
// options: detailed profiles + every ISIC class, filtered by group and search
function activityOptions(selectEl, group, q, cur) {
  const prof = ACT.filter((a) => (!group || a.group === group) && matches(q, a.name_ar, a.name_en, a.isic));
  const cls = ISIC.filter((r) => (!group || actById(r.p).group === group) && matches(q, r.ar, r.en, r.c));
  let html = prof.length ? `<optgroup label="${L("أنشطة بقيم تفصيلية", "Activities with detailed values")}">` + prof.map((a) => `<option value="p:${a.id}">${name(a)} · ${a.isic}</option>`).join("") + "</optgroup>" : "";
  const bySec = {};
  cls.forEach((r) => { (bySec[r.s] = bySec[r.s] || []).push(r); });
  Object.keys(bySec).sort().forEach((s) => { html += `<optgroup label="${s} · ${AR() ? SECS[s][0] : SECS[s][1]}">` + bySec[s].map((r) => `<option value="i:${r.c}">${r.c} · ${isicName(r)}</option>`).join("") + "</optgroup>"; });
  selectEl.innerHTML = html || `<option value="">${L("لا توجد نتيجة", "No match")}</option>`;
  if (cur && [...selectEl.options].some((o) => o.value === cur)) selectEl.value = cur;
}
function resolveActivity(val) {
  if (!val) return null;
  const [k, id] = val.split(":");
  if (k === "p") { const a = actById(id); return { a, label: name(a), code: a.isic, nq: nqForProfile(a) }; }
  const r = ISIC.find((x) => x.c === id); if (!r) return null;
  return { a: actById(r.p), label: `${r.c} · ${isicName(r)}`, code: r.c, nq: r.n };
}

const BANDK = ["lg", "mg", "hg", "pl"];
const BANDN = () => ({ red: L("أحمر", "Red"), lg: L("أخضر منخفض", "Low green"), mg: L("أخضر متوسط", "Medium green"), hg: L("أخضر مرتفع", "High green"), pl: L("بلاتيني", "Platinum") });
const fullWage = (y) => (y <= 2026 ? 4000 : y === 2027 ? 5000 : 6000);
function nqRequired(id, n, y) {
  const a = NQ.find((x) => x.id === id) || NQ[NQ.length - 1], yy = String(Math.min(Math.max(y, 2026), 2028)).slice(2), out = {};
  let prev = 0;
  BANDK.forEach((b) => { let r = a["m_" + b] * Math.log(Math.max(1, n)) + a[`c${yy}_${b}`]; r = Math.min(100, Math.max(0, r, prev)); out[b] = r; prev = r; });
  return out;
}
function saStaff() { const v = (id) => Math.max(0, +$(id).value || 0); return { b6: v("sa-b6"), b5: v("sa-b5"), b4: v("sa-b4"), b3: v("sa-b3"), b0: v("sa-b0"), pt: v("sa-pt"), st: v("sa-st"), fx: v("sa-fx"), ds: v("sa-ds"), ns: v("sa-ns") }; }
function saAssess(id, s, y) {
  const t = fullWage(y), w = (lo) => (lo >= t ? 1 : lo >= 3000 ? 0.5 : 0);
  let num = s.b6 * w(6000) + s.b5 * w(5000) + s.b4 * w(4000) + s.b3 * w(3000) + 0.5 * s.pt + 0.5 * s.st + s.fx / 3 + 4 * s.ds;
  const den = s.b6 + s.b5 + s.b4 + s.b3 + s.b0 + s.pt + s.st + s.fx + s.ds * 4 + s.ns, heads = s.b6 + s.b5 + s.b4 + s.b3 + s.b0 + s.pt + s.st + s.fx + s.ds + s.ns;
  const rate = den ? (100 * num) / den : 0;
  if (heads <= 5) return { t, num, den, rate, heads, small: true, band: num >= 1 ? "pl" : "red", req: null, hires: { lg: num >= 1 ? 0 : 1, mg: num >= 1 ? 0 : 1, hg: num >= 1 ? 0 : 1, pl: num >= 1 ? 0 : 1 } };
  const req = nqRequired(id, Math.round(den), y);
  let band = "red"; BANDK.forEach((b) => { if (rate >= req[b] - 1e-9) band = b; });
  const hires = {}; BANDK.forEach((b) => { const tg = req[b] / 100; hires[b] = tg >= 1 ? Infinity : Math.max(0, Math.ceil((tg * den - num) / (1 - tg) - 1e-9)); });
  return { t, num, den, rate, heads, small: false, band, req, hires };
}

  $("tr-anc-l").textContent = L(`مبيعات منتجات تبقى أسعارها ثابتة: ${fmt(anc * 100)}%`, `Sales of items whose price stays fixed: ${fmt(anc * 100)}%`);
  const avg = need * (1 - eff), other = anc < 1 ? avg / (1 - anc) : avg;
  const dates = steps === 1 ? [[L("يناير 2027", "Jan 2027"), 1]] : steps === 2 ? [[L("يناير 2027", "Jan 2027"), 0.55], [L("مايو 2027", "May 2027"), 0.45]] : [[L("يناير 2027", "Jan 2027"), 0.4], [L("مايو 2027", "May 2027"), 0.3], [L("مايو 2028", "May 2028"), 0.3]];
  $("tr-out").innerHTML = `<div><span class="small">${L("متوسط زيادة سعر ما يدفعه العميل", "Average rise on what customers pay")}</span><b>${fmt(avg, 2)}%</b><span class="small">${L("بدل", "instead of")} ${fmt(need, 2)}%</span></div><div><span class="small">${L("على المنتجات غير الثابتة", "On items not held fixed")}</span><b>${fmt(other, 2)}%</b><span class="small">${L("منتجاتك الأساسية بدون تغيير", "essentials unchanged")}</span></div><div><span class="small">${L("أكبر دفعة واحدة", "Largest single step")}</span><b>${fmt(other * Math.max(...dates.map((d) => d[1])), 2)}%</b><span class="small">${L(steps === 1 ? "دفعة واحدة" : steps === 2 ? "دفعتان" : "3 دفعات", steps === 1 ? "one step" : steps + " steps")}</span></div>`;
  let cum = 0;
  $("t-tr").innerHTML = `<thead><tr><th>${L("الموعد", "When")}</th><th class="n">${L("الزيادة", "Rise")}</th><th class="n">${L("التراكمي", "Cumulative")}</th><th>${L("المرتبط به", "Tied to")}</th></tr></thead><tbody>` +
    dates.map(([d, sh], i) => { cum += other * sh; const why = i === 0 ? L("تعرفة الكهرباء والمياه", "Power & water tariffs") : i === 1 ? L("حد نطاقات 5,000", "Nitaqat 5,000") : L("حد نطاقات 6,000", "Nitaqat 6,000"); return `<tr><td>${d}</td><td class="n">+${fmt(other * sh, 2)}%</td><td class="n">${fmt(cum, 2)}%</td><td class="small">${why}</td></tr>`; }).join("") + "</tbody>";
  const c = C();
  mk("c-tr", { type: "bar", data: { labels: [L("الزيادة اللازمة", "Needed"), L("بعد الكفاءة", "After efficiency"), L("متوسط العميل", "Customer average"), L("المنتجات غير الثابتة", "Non-fixed items")], datasets: [{ label: "%", data: [need, need * (1 - eff), avg, other], backgroundColor: [c.ink2, c.aux, c.old, c.nw], borderRadius: 3, barPercentage: 0.55 }] },
    options: base({ yt: { callback: (v) => v + "%" }, tip: { label: (x) => fmt(x.raw, 2) + "%" } }) });
  message(avg, dates.length);
}
function message(avg, nSteps) {
  const nm = ($("ms-name").value || "").trim(), n = nm || L("", "us"), r = [], cm = [];
  if ($("ms-r1").checked) r.push(L("تعرفة الكهرباء والمياه الجديدة التي تبدأ في 1 يناير 2027", "the new electricity and water tariffs from 1 January 2027"));
  if ($("ms-r2").checked) r.push(L("رفع رواتب زملائنا السعوديين وفق برنامج نطاقات", "higher pay for our Saudi colleagues under the Nitaqat programme"));
  if ($("ms-r3").checked) r.push(L("ارتفاع أسعار بعض الموردين", "higher prices from some suppliers"));
  if ($("ms-c1").checked) cm.push(L("أسعار منتجاتنا الأساسية تبقى كما هي", "our essential items keep their current price"));
  if ($("ms-c2").checked) cm.push(L("لن نغيّر الجودة ولا الكميات", "we will not change quality or portion sizes"));
  if ($("ms-c3").checked) cm.push(L("عملاؤنا الدائمون يحصلون على خصم خاص", "regular customers get a special discount"));
  const join = (a) => (a.length <= 1 ? a.join("") : a.slice(0, -1).join(AR() ? "، و" : ", ") + (AR() ? "، و" : " and ") + a[a.length - 1]);
  $("ms-out").textContent = AR()
    ? `عملاءنا الكرام،\n\n${nm ? `نشكر ثقتكم بـ${nm}.` : "نشكر ثقتكم بنا."} نود إبلاغكم مسبقاً بتعديل بعض أسعارنا بمتوسط ${fmt(avg, 1)}%${nSteps > 1 ? ` على ${nSteps === 2 ? "مرحلتين" : "3 مراحل"} خلال 2027${nSteps > 2 ? " و2028" : ""}` : " ابتداءً من يناير 2027"}.\n\n${r.length ? `سبب التعديل: ${join(r)}. ` : ""}امتصصنا جزءاً من هذه التكاليف بتحسين كفاءتنا، ونمرر الجزء المتبقي فقط.\n\n${cm.length ? `التزامنا لكم: ${join(cm)}.\n\n` : ""}نسعد باستفساراتكم في أي وقت.\n${nm || "إدارة المنشأة"}`
    : `Dear customers,\n\nThank you for trusting ${n}. We are letting you know in advance that some of our prices will change by an average of ${fmt(avg, 1)}%${nSteps > 1 ? ` in ${nSteps} steps during 2027${nSteps > 2 ? " and 2028" : ""}` : " from January 2027"}.\n\n${r.length ? `The reason: ${join(r)}. ` : ""}We have absorbed part of these costs by working more efficiently and are passing on only the rest.\n\n${cm.length ? `Our commitment: ${join(cm)}.\n\n` : ""}We are happy to answer any question.\n${nm || "The management"}`;
}
function sectorSearch(group) {
  const box = $("il-" + group); if (!box) return;
  const q = $("q-" + group).value, rows = ISIC.filter((r) => actById(r.p).group === group && matches(q, r.ar, r.en, r.c));
  box.innerHTML = rows.slice(0, 80).map((r) => `<button type="button" class="chip" data-c="${r.c}"><span class="num">${r.c}</span> ${isicName(r)}</button>`).join("") + (rows.length > 80 ? `<span class="small">+${rows.length - 80} ${L("نشاطاً آخر، حدّد البحث", "more, narrow the search")}</span>` : "") + (rows.length ? "" : `<span class="small">${L("لا توجد نتيجة", "No match")}</span>`);
  box.querySelectorAll("[data-c]").forEach((b) => b.addEventListener("click", () => openClass(b.dataset.c)));
  $("ic-" + group).textContent = L(`${fmt(rows.length)} نشاطاً`, `${fmt(rows.length)} activities`);
}
function openClass(code) {
  const r = ISIC.find((x) => x.c === code); if (!r) return;
  $("b-grp").value = actById(r.p).group; $("b-q").value = ""; bActOptions(); $("b-act").value = "i:" + code;
  show("business"); bLoad(false);
  try { history.replaceState(null, "", "#business"); } catch (e) {}
  window.scrollTo({ top: 0 });
}

const VIEWS = ["overview", "inflation", "household", "business", "saudization", "trust", "commercial", "industrial", "agri", "society", "labour", "solutions", "faq", "method"];
function draw(v) {
  try {
  if (v === "overview") overview();
  if (v === "inflation") { inflationPage(); forecastView(); forecastStatic(); }
  if (v === "household") { household(); profilesCharts(); }
  if (v === "business") business();
  if (v === "commercial") { catalogView("commercial"); tariffTables(); sectorSearch("commercial"); }
  if (v === "industrial") { industrialView(); sectorSearch("industrial"); }
  if (v === "agri") { catalogView("agricultural"); sectorSearch("agricultural"); }
  if (v === "saudization") saudization();
  if (v === "trust") { trustStatic(); if (!$("tr-need").value) $("tr-need").value = bNeed().toFixed(2); trust(); }
  if (v === "society") society();
  if (v === "labour") labour();
  if (v === "solutions") { solutionsStatic(); solutionsView(); }
  if (v === "faq") faqRender();
  if (v === "method") method();
  } catch (e) { console.error("view " + v, e); }
}
function show(v) {
  if (!VIEWS.includes(v)) v = "overview";
  VIEW = v;
  VIEWS.forEach((x) => { $("v-" + x).hidden = x !== v; });
  document.querySelectorAll("#tabs a").forEach((a) => a.setAttribute("aria-current", a.dataset.v === v ? "page" : "false"));
  const act = document.querySelector(`#tabs a[data-v="${v}"]`); if (act && act.scrollIntoView) try { act.scrollIntoView({ block: "nearest", inline: "nearest" }); } catch (e) {}
  draw(v);
}
function applyLang() {
  document.documentElement.lang = LANG; document.documentElement.dir = AR() ? "rtl" : "ltr";
  document.querySelectorAll("[data-ar]").forEach((el) => { el.textContent = AR() ? el.dataset.ar : el.dataset.en; });
  document.querySelectorAll("[data-ph-ar]").forEach((el) => { el.placeholder = AR() ? el.dataset.phAr : el.dataset.phEn; });
  $("faq-s").placeholder = L("مثال: البدل، نطاقات، مطعم، الطاقة الشمسية", "e.g. allowance, Nitaqat, restaurant, solar");
  $("l-ar").setAttribute("aria-pressed", AR()); $("l-en").setAttribute("aria-pressed", !AR());
  $("gen").textContent = L(" · آخر بناء للبيانات: ", " · Data built: ") + S.generated;
  bActOptions();
  saOptions();
  ["commercial", "industrial", "agricultural"].forEach((g) => { $("q-" + g).placeholder = L("مثال: مطعم، 4711، أدوية، خرسانة", "e.g. restaurant, 4711, pharma, concrete"); });
  $("b-q").placeholder = $("sa-q").placeholder = L("مثال: صيدلية، 5610، بلاستيك", "e.g. pharmacy, 5610, plastics");
  $("ms-name").placeholder = L("مثال: مطعم الواحة", "e.g. Oasis Restaurant");
  miniLang();
  if (PI_STATE) piCats();
}
function setLang(l) { LANG = l; try { localStorage.setItem("ww-lang", l); } catch (e) {} applyLang(); show(VIEW); }
const go = (v) => { show(v); try { history.replaceState(null, "", "#" + v); } catch (er) {} window.scrollTo({ top: 0 }); };

$("l-ar").addEventListener("click", () => setLang("ar"));

document.querySelectorAll("#roles [data-go]").forEach((a) => a.addEventListener("click", (e) => { e.preventDefault(); if (a.dataset.grp) { $("b-grp").value = a.dataset.grp; bActOptions(); bLoad(false); } go(a.dataset.go); }));
const link = (a, b, fn) => { $(a).addEventListener("input", () => { $(b).value = $(a).value; fn(); }); $(b).addEventListener("input", () => { $(a).value = $(b).value; fn(); }); };

["sa-b6", "sa-b5", "sa-b4", "sa-b3", "sa-b0", "sa-pt", "sa-st", "sa-fx", "sa-ds", "sa-ns"].forEach((id) => $(id).addEventListener("input", saudization));

["tr-need", "tr-eff", "tr-anc", "tr-plan", "ms-name", "ms-r1", "ms-r2", "ms-r3", "ms-c1", "ms-c2", "ms-c3"].forEach((id) => $(id).addEventListener("input", trust));

function selectMsg() { const r = document.createRange(); r.selectNodeContents($("ms-out")); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); $("ms-copied").textContent = L("حدّد النص وانسخه", "Text selected: copy it"); }
$("b-emp").addEventListener("change", () => bLoad(true));
$("b-reset").addEventListener("click", () => bLoad(true));
["b-rev", "b-mat", "b-rent", "b-oth", "b-kwh", "b-br", "b-m3", "b-n1", "b-w1", "b-n2", "b-w2", "b-n3", "b-w3", "b-n4", "b-w4", "b-im", "b-ir", "b-io", "b-comply", "b-price"].forEach((id) => $(id).addEventListener("input", business));
